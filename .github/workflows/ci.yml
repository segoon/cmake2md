name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      # Spelled out rather than `make test`: the Windows runners have no make.
      - run: pytest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      # What "checked" means is decided by the Makefile, so a check added
      # there cannot be forgotten here.  This re-runs the tests the matrix
      # above already ran, which costs a second and keeps the two in step.
      - run: make check example-check toc-check PYTHON=python

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # Install the built wheel, outside the source tree, to prove it ships
      # the packaged templates and not just the Python modules.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/cmake2doc --version
          /tmp/smoke/bin/cmake2doc \
            --template function.md.jinja \
            --output /tmp/smoke/out.md \
            examples/md/CMakeLists.txt
          grep -q example_add_library /tmp/smoke/out.md

  ci-ok:
    # The one check to require for merging, so that the matrix can grow or
    # shrink without anyone editing the branch protection rule.
    #
    # always() matters: without it this job would be *skipped* when a
    # dependency fails, and a skipped required check does not block a merge.
    if: always()
    needs: [test, check, package]
    runs-on: ubuntu-latest
    steps:
      - name: Some job did not succeed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: exit 1
